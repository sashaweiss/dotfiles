title = ye olde terminale
macos-titlebar-style = tabs

font-family = Natasha II
font-size = 18.0

macos-option-as-alt = left

window-padding-x = 8

confirm-close-surface = false

theme = Oceanic Next

# Send Escape+Return for Shift+Enter (like Alt+Enter), to ensure all apps
# can distinguish from a simple Enter even through layers like tmux and moat.
keybind = shift+enter=text:\x1b\r
